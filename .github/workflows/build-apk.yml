name: Compilar APK Leandro Correa Launcher

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixar Código
      uses: actions/checkout@v4

    - name: Instalar Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Corrigir Nomes de Arquivos com Espaço
      run: |
        cd app/src/main/res/drawable || true
        for f in *\ * *:* ; do
          if [ -f "$f" ]; then
            clean_name=$(echo "$f" | sed 's/^[ :]*//')
            mv "$f" "$clean_name"
            echo "Corrigido nome de: $f para: $clean_name"
          fi
        done

    - name: Configurar Gradle 8.7
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: "8.7"

    - name: Compilar APK
      run: gradle assembleDebug --no-daemon

    - name: Publicar APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: LeandroCorreaLauncher-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 14
